name: build
on: { workflow_dispatch: }
jobs:
  pre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD/arsenal:/a:ro" --platform linux/amd64 kalilinux/kali-rolling bash -lc '
            apt-get update -qq >/dev/null 2>&1; m=""
            while read -r p; do [ -z "$p" ] && continue
              apt-cache policy "$p" 2>/dev/null | grep -q Candidate || m="$m $p"; done < /a/packages.list
            [ -n "$m" ] && { echo "::error::missing:$m"; exit 1; }; echo ok'
  build:
    needs: pre
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - uses: actions/cache@v4
        id: i
        with:
          path: /tmp/a.zst
          key: "arsenal-${{ hashFiles('arsenal/Dockerfile','arsenal/packages.list','arsenal/tools.list') }}"
      - if: steps.i.outputs.cache-hit != 'true'
        run: docker build -t xan/arsenal:v1 arsenal/ && docker run --rm xan/arsenal:v1 smoke && docker save xan/arsenal:v1 | zstd -19 -T0 -o /tmp/a.zst
      - run: zstd -d -c /tmp/a.zst | docker load && docker run --rm xan/arsenal:v1 smoke && echo image-ok
