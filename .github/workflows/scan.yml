name: scan
on:
  workflow_dispatch:
    inputs:
      target: { required: true }
      scope:  { required: true }
      shards: { default: "8" }
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - run: |
          git clone -q "https://x:${{ secrets.STATE_PAT }}@github.com/${{ github.repository_owner }}/xan-state.git" /tmp/s
          mkdir -p /tmp/s/hosts && printf '%s\n' "${{ inputs.target }}" > "/tmp/s/hosts/${{ inputs.target }}.txt"
          git -C /tmp/s add -A && git -C /tmp/s -c user.email=a@b -c user.name=x commit -qm hosts && git -C /tmp/s push -q origin HEAD
  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy: { fail-fast: false, max-parallel: 16, matrix: { id: [1,2,3,4,5,6,7,8] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with: { path: /tmp/a.zst, key: "arsenal-${{ hashFiles('arsenal/Dockerfile','arsenal/packages.list','arsenal/tools.list') }}" }
      - run: zstd -d -c /tmp/a.zst | docker load
      - run: |
          docker run --rm --cap-add=NET_RAW --cap-add=NET_ADMIN --memory=6g --cpus=3 \
            -v "$PWD:/src" -w /src -e STATE_PAT -e GH_USER -e TARGET -e SCOPE \
            xan/arsenal:v1 python3 -m hexencore.shard --shard ${{ matrix.id }} --of 8
        env:
          STATE_PAT: ${{ secrets.STATE_PAT }}
          GH_USER: ${{ github.repository_owner }}
          TARGET: ${{ inputs.target }}
          SCOPE: ${{ inputs.scope }}
